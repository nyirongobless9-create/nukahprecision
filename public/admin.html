<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUKAH | Store administration</title><link rel="stylesheet" href="/style.css"></head><body class="adminPage"><header class="adminHeader"><div class="container"><h1>NUKAH Store Admin</h1><a href="/">← Storefront</a></div></header><main class="container adminContent"><section id="loginPanel" class="adminCard narrow"><h2>Staff sign in</h2><p>Enter the administrator password configured on the server.</p><form id="loginForm" class="form"><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button navy">Sign in</button></form><p id="loginStatus" class="notice"></p></section><div id="dashboard" hidden><div class="adminCard"><div class="sectionTop"><div><h2>Store management</h2><p class="subtle">Set verified MWK prices before products can be purchased online. Leave price blank for quotation only.</p></div><button id="logout" class="button navy">Sign out</button></div></div><section class="adminCard"><h2>Orders</h2><button id="refreshOrders" class="adminButton">Refresh orders</button><div id="orders" class="tableWrap"></div></section><section class="adminCard"><h2>Products & pricing</h2><div id="adminProducts" class="tableWrap"></div></section><section class="adminCard"><h2>Add a new product</h2><form id="addProduct" class="form adminGrid"><label>Product ID (letters, numbers, hyphens)<input name="id" required placeholder="custom-engraving"></label><label>Product name<input name="name" required></label><label>Category<select name="category"><option>Engraving</option><option>Card Printing</option><option>Key Making</option><option>Key Programming</option></select></label><label>Illustration<select name="image"><option value="service-0.png">Engraving</option><option value="service-1.png">Card printing</option><option value="service-2.png">Key making</option><option value="service-3.png">Key programming</option></select></label><label>Price (MWK; blank for quotation)<input name="price" type="number" min="1" step="1"></label><label>Stock (blank for unlimited / made to order)<input name="stock" type="number" min="0" step="1"></label><label>Description<textarea name="description" required></textarea></label><div><button class="button gold" type="submit">Add product</button></div></form><p id="adminStatus" class="notice"></p></section></div></main><script src="/admin.js" defer></script></body></html>
